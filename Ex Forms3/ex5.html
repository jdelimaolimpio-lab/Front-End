<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 5 - Formulário Completo</title>
</head>
<body>

  <form action="arquivo.html" method="post">
    
    <label for="nome">Nome:</label><br>
    <input type="text" id="nome" name="nome_usuario" required>
    <br><br>

    <label for="email">E-mail:</label><br>
    <input type="email" id="email" name="email_usuario" required>
    <br><br>


    <h3>Qual a sua marca de processador favorita?</h3>
    <input type="radio" id="amd" name="processador" value="amd">
    <label for="amd">AMD</label>
    <br><br>

    <input type="radio" id="intel" name="processador" value="intel">
    <label for="intel">Intel</label>
    <br><br>

    
    <h3>Quais periféricos você possui?</h3>
    <input type="checkbox" id="teclado" name="perifericos" value="teclado_mecanico">
    <label for="teclado">Teclado Mecânico</label>
    <br><br>

    <input type="checkbox" id="mouse" name="perifericos" value="mouse_gamer">
    <label for="mouse">Mouse Gamer</label>
    <br><br>

    <input type="checkbox" id="headset" name="perifericos" value="headset">
    <label for="headset">Headset</label>
    <br><br>

    <
    <h3> Qual o seu Estado?</h3>
    <select id="estado_usuario" name="estado_usuario">
      <option value="SP">São Paulo</option>
      <option value="RJ">Rio de Janeiro</option>
      <option value="MG">Minas Gerais</option>
      <option value="PR">Paraná</option>
    </select>
    <br><br>

   
    <h3>Deixe um comentário sobre o seu PC:</h3>
    <textarea id="comentario" name="comentario_pc" rows="5" cols="40"></textarea>
    <br><br>

    
    <input type="checkbox" id="confirmacao" name="confirmacao" required>
    <label for="confirmacao">Confirmo que as informações são verdadeiras</label>
    <br><br>

    
    <button type="submit">Enviar Formulário</button>
  </form>

</body>
</html>
