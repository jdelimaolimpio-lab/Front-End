<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 1 - Radio Button</title>
</head>
<body>

  <form action="arquivo.html" method="post">
    <h3>Qual a sua marca de processador favorita?</h3>

    <input type="radio" id="amd" name="processador" value="amd">
    <label for="amd">AMD</label>
    <br><br>

    <input type="radio" id="intel" name="processador" value="intel">
    <label for="intel">Intel</label>
    <br><br>

    <button type="submit">Submeter</button>
  </form>

</body>
</html>
