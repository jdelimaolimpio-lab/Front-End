<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 2 - Checkbox</title>
</head>
<body>

  <form action="arquivo.html" method="post">
    <h3>Quais periféricos você possui?</h3>

    <input type="checkbox" id="teclado" name="perifericos" value="teclado_mecanico">
    <label for="teclado">Teclado Mecânico</label>
    <br><br>

    <input type="checkbox" id="mouse" name="perifericos" value="mouse_gamer">
    <label for="mouse">Mouse Gamer</label>
    <br><br>

    <input type="checkbox" id="headset" name="perifericos" value="headset">
    <label for="headset">Headset</label>
    <br><br>

    <button type="submit">Submeter</button>
  </form>

</body>
</html>
