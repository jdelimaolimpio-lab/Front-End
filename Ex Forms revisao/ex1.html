<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lendas de Aço </title>
</head>
<body>

  <form action="arquivo.html" method="post">
     <h2>Dados do Jogador</h2><br>
    <label for="nome">Nome do Jogador:</label><br>
    <input type="text" id="nome" name="nome_usuario" required>
    <br><br>

    <label for="senha">Senha de Acesso: </label><br>
    <input type="password" id="senha" name="senha_usuario" required>
    <br><br>

     <label for="email">E-mail de cadastro: </label><br>
    <input type="email" id="email" name="email_usuario" required>
    <br><br>

       <label for="data">Data de nascimento: </label><br>
    <input type="date" id="data" name="data_nascimento" required>
    <br><br>

    <label for="telefone">Telefone de Contato (WhatsApp) : </label><br>
    <input type="telefone" id="telefone" name="telefone_usuario" required>
    <br><br>


    <h3>Escolha sua Facção</h3>
    <input type="radio" id="cangaceiros" name="cangaceiros" value="cangaceiros">
    <label for="cangaceiros">Cangaceiros de Bronze</label>
    <br><br>
     

    <input type="radio" id="coroneis" name="coroneis" value="coroneis">
    <label for="coroneis">Coronéis do Vapor</label>
    <br><br>

    
    <h3>Qual seu estilo de combate? </h3>
    <select id="estilo_combate" name="estilo_combate">
      <option value="agressivo">Agressivo (Foco em dano)</option>
      <option value="defensivo">Defensivo (Foco em Armaduras) </option>
      <option value="tatico">Tático (Foco em Efeitos Especiais)</option>
      
    </select>
    <br><br>

    <h3>Onde você costuma jogar?</h3>
    <input type="checkbox" id="pc_mesa" name="equipamentos[]" value="pc_mesa">
    <label for="pc_mesa">PC de Mesa</label>
    <br><br>

    <input type="checkbox" id="notebook" name="equipamentos[]" value="notebook">
    <label for="notebook">Notebook</label>
    <br><br>

    <input type="checkbox" id="console" name="equipamentos[]" value="console">
    <label for="console">Console</label>
    <br><br>

    <label for="horas_teste">Quantas horas por semana você pode testar o jogo?</label><br>
    <input type="number" id="horas_teste" name="horas_teste" min="1" max="40">
    <br><br>

   
    <h3>Porque você quer testar o jogo?</h3>
    <textarea id="comentario" name="comentario_jogo" rows="6" cols="50"></textarea>
    <br><br>

    
    <input type="checkbox" id="confirmacao" name="confirmacao" required>
    <label for="confirmacao"><strong>Li e aceito o Acordo de Confidencialidade</strong></label>
    <br><br>

    
    <button type="submit">Selecionar Acesso ao Beta</button>
  </form>

</body>
</html>
